[package]
name = "dem-devtools"
description = "Development tools (`dem-dev`). Never shipped; may bypass dem-core but must use dem-store and dem-crypto for all library access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dem-dev"
path = "src/main.rs"

[dependencies]
dem-model.workspace = true
dem-core.workspace = true
tempfile.workspace = true
dem-crypto.workspace = true
dem-store.workspace = true
dem-diag.workspace = true
dem-testkit.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
jiff.workspace = true
dem-index = { workspace = true, features = ["fixtures"] }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
tracing.workspace = true

[lints]
workspace = true
