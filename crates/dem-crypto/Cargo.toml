[package]
name = "dem-crypto"
description = "Key hierarchy and encryption envelopes. Wraps audited libraries only; implements no primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# RustCrypto, digest-0.10 / aead-0.5 generation (chacha20poly1305 0.10 was covered
# by the NCC Group audit of the RustCrypto AEADs).
chacha20poly1305 = { version = "0.10.1", features = ["stream", "std"] }
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = { version = "1.9", features = ["derive"] }
data-encoding = "2.11"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
